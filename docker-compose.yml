version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Set in a .env file next to this compose file (see .env.example).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      # Optional: students must enter this code in the playground. Empty = no code.
      LAB_ACCESS_CODE: ${LAB_ACCESS_CODE:-}
    ports:
      - "127.0.0.1:3000:3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "4321:4321"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: