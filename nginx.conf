# Copied into the nginx image as /etc/nginx/templates/default.conf.template.
# At start-up the official nginx entrypoint fills in the two placeholders below from the
# container environment (the OpenRouter key and the optional class access code). Only
# variables defined in the environment are replaced, so nginx's own $variables are safe.

# Per-client rate limit for the LLM proxy. Each playground run = 2 requests (answer + coach).
# Students behind one classroom NAT share an IP, so this is deliberately generous;
# OpenRouter's own free-model limits (20 req/min, 50 or 1000 req/day per ACCOUNT) still apply.
limit_req_zone $binary_remote_addr zone=llm:10m rate=30r/m;

# Optional class access code (LAB_ACCESS_CODE, letters/digits only). Empty = no code needed,
# and whatever a student types in the code field is then ignored.
map "${LAB_ACCESS_CODE}" $lab_code_required { "" 0; default 1; }
map $http_x_lab_code $lab_code_wrong { "${LAB_ACCESS_CODE}" 0; default 1; }
map "$lab_code_required$lab_code_wrong" $lab_deny { "11" 1; default 0; }

server {
    listen 3000 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real client IP from Caddy (docker network) so the rate limit is per visitor.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Prompt Lab -> OpenRouter. Only this one endpoint is exposed.
    location = /api/llm/chat/completions {
        default_type application/json;
        limit_except POST { deny all; }
        limit_req zone=llm burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @site_rate_limit;
        client_max_body_size 64k;

        # Students enter the class code in the playground settings; sent as X-Lab-Code.
        if ($lab_deny) {
            return 403 '{"error":{"code":"lab_code","message":"Class access code required or incorrect"}}';
        }

        # Resolve at request time (Docker's embedded DNS) so a DNS hiccup at
        # container start can't stop nginx from serving the rest of the site.
        resolver 127.0.0.11 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $openrouter_upstream https://openrouter.ai;
        proxy_pass $openrouter_upstream/api/v1/chat/completions;
        proxy_ssl_server_name on;
        proxy_ssl_name openrouter.ai;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host openrouter.ai;
        proxy_set_header Authorization "Bearer ${OPENROUTER_API_KEY}";
        proxy_set_header HTTP-Referer "https://starlost-blog.limitlesstech-co.com";
        proxy_set_header X-Title "StarLost Prompt Lab";
        proxy_set_header X-Lab-Code "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location @site_rate_limit {
        default_type application/json;
        return 429 '{"error":{"code":"site_rate_limit","message":"Too many requests from this network (site limit)"}}';
    }

    location /api/ {
        return 404;
    }
}
